name: Voice app checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r windows/requirements-hotkey.txt
      - run: python -m unittest discover -s windows/tests -p "test_*.py" -v
      - run: python -m unittest discover -s tools/tests -p "test_*.py" -v
  scope-and-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: python3 tools/check_scope.py
      - run: bash tools/test-host.sh
  macos-client:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install -r macos/requirements.txt
      - run: python -c "import Quartz, ApplicationServices, sounddevice"
      - run: python -m unittest discover -s macos/tests -p "test_*.py" -v
      - run: python -m unittest discover -s windows/tests -p "test_*.py" -v
